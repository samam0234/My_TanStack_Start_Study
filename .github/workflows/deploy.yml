name: Publish and deploy
on:
  workflow_run:
    workflows: [Study checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}

  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: publish
    environment: production
    runs-on: [self-hosted, linux, tanstack-study]
    permissions: {}
    steps:
      - name: Deploy tested image
        env:
          BOARD_IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -eu
          cd /srv/tanstack-start-study
          docker compose pull web worker
          docker compose up -d --no-build --wait
